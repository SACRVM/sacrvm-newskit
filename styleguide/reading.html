<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
    <title>NEWSKIT — Reading layer</title>
    <!-- A reference page on appkit's showcase layer (the kit style guide's
         look). The page is showcase.css; every specimen renders in its own
         shadow root on ui.css + newskit.css only (sg-specimen.js). -->
    <link rel="stylesheet" href="../kit/css/ui.css">
    <link rel="stylesheet" href="../kit/css/showcase.css">
    <link rel="stylesheet" href="../newskit/newskit.css">

    <script defer src="../kit/js/lib/globals.js"></script>
    <script defer src="../kit/js/i18n/de.js"></script>
    <script defer src="../kit/js/lib/icons.js"></script>
    <script defer src="../kit/js/lib/router.js"></script>
    <script defer src="../kit/js/lib/showcase.js"></script>
    <script defer src="../kit/js/components/sac-icon.js"></script>
    <script defer src="../kit/js/components/sac-nav.js"></script>
    <script defer src="../kit/js/components/sac-theme-toggle.js"></script>
    <script defer src="../kit/js/components/sac-lang-toggle.js"></script>
    <script defer src="sg-specimen.js"></script>
    <script defer src="sg-nav.js"></script>
</head>
<body class="app-page">
    <sac-nav brand="NEWSKIT" brand-icon="document"
             brand-href="https://sacrvm.github.io/sacrvm-appkit/#/styleguide/addons">
        <div slot="context">
            <sac-lang-toggle></sac-lang-toggle>
            <sac-theme-toggle></sac-theme-toggle>
        </div>
    </sac-nav>

    <div class="main-layout">
        <div class="app-scroll">
            <div class="sg-page" id="page"></div>
        </div>
    </div>

    <script defer>
        document.addEventListener("DOMContentLoaded", () => {
            const { code, table, compact, note } = sac.showcase;
            const page = document.getElementById("page");
            page.innerHTML = `
                <h1>The reading layer</h1>
                <p class="lead">Appkit's look, specialised for reading: the ~40rem prose
                   measure, the article type scale, and one new face — Oswald, condensed
                   and uppercase — carrying the news signature. Everything else is
                   appkit's own tokens, in light, dark and auto. Needs SACRVM APPKIT
                   2.24.0 or newer.</p>

                ${sg.demo(`
                    <p class="sac-kicker">Type specimen · Reading layer</p>
                    <h1>A headline in the display voice</h1>
                    <p class="sac-standfirst">The standfirst sits a quiet step below the
                    body and states what the piece establishes, in one or two
                    sentences.</p>
                    <p>The body is <strong>Inter at 17px</strong> on <code>--text-read</code>,
                    softened a step off the pure foreground so long passages don't halate
                    on the dark ground. Lines cap at the <code>--measure</code> of 40rem,
                    around 68 characters, and accent-as-text carries
                    <a href="#use">a link like this one</a>.</p>
                    <h2>The section tier</h2>
                    <p>An <code>h2</code> steps the display voice down to section scale.</p>
                    <h3>The entry tier</h3>
                    <p>An <code>h3</code> is the title weight of a record card — Oswald 500.</p>
                    <h4>The subhead tier</h4>
                    <ul>
                        <li>Lists sit inside the measure, markers on <code>--text-muted</code>.</li>
                        <li>Emphasis is <em>italic</em>; importance is <strong>a weight and ink step</strong>.</li>
                    </ul>
                    <ol>
                        <li>Ordered lists share the same rhythm.</li>
                        <li>Nothing falls below the 0.7rem micro-type floor.</li>
                    </ol>
                    <blockquote><p>A plain blockquote stays quiet — hairline-led, muted ink.</p></blockquote>
                    <hr>
                    <p>Plain HTML needs no classes inside the container.</p>`)}

                <h2 id="use">Use</h2>
                <p>Vendor <code>newskit/</code> next to appkit's <code>kit/</code> and link
                   <code>newskit.css</code> after <code>ui.css</code>. Inside
                   <code>&lt;sac-article&gt;</code> (or <code>.sac-article</code>) plain
                   prose takes the reading voice with no classes; outside it, appkit's UI
                   type stays untouched.</p>
                ${code(`<link rel="stylesheet" href="kit/css/ui.css">
<link rel="stylesheet" href="newskit/newskit.css">

<sac-article>
    <h1>Headline</h1>
    <p>Plain prose …</p>
</sac-article>`)}

                <h2 id="api">API</h2>
                ${table("Element", [
                    ["sac-article", "The reading container: 52rem wide, centred, Inter at the 17px reading size on <code>--text-read</code>. Sets the reading voice for its whole subtree. CSS only, no script."],
                    [".sac-article", "Class fallback, identical treatment."],
                ])}
                ${table("Class", [
                    [".sac-kicker", "The accent eyebrow above a headline (Outfit 700, uppercase). Inside <code>sac-masthead</code> write <code>.kicker</code>."],
                    [".sac-standfirst", "The quiet summary under a headline (1.25rem, capped at the measure). Inside <code>sac-masthead</code> write <code>.standfirst</code>."],
                ])}
                ${table("Token", [
                    ["--display-font", "The headline face: <code>'Oswald', 'Arial Narrow', sans-serif</code>. Swap the news voice in one line."],
                    ["--measure", "The prose measure, <code>40rem</code> (~68 characters). Text blocks cap to it; figures and records may run wider."],
                    ["--text-read", "Long-form reading ink, 88% of the foreground. Headings and <code>strong</code> keep <code>--text</code>."],
                    ["--text-standfirst", "Standfirst ink, 84% of the foreground."],
                    ["--accent-soft", "The quiet accent tint plane (9%) under highlights, callouts and cite chips. Re-solved inside an app's own accent scope."],
                    ["--warm-soft", "The warm tint plane (10%): the method / disclosure signature."],
                ])}
                ${table("Font", [
                    ["Oswald 500 / 600", "Self-hosted (OFL 1.1), latin + latin-ext subsets in <code>newskit/fonts/</code>. Only these two weights exist; no CDN."],
                ])}
                ${compact("under 38rem the reading size steps from 17px down to 16px; the measure and the scale stay.")}
                ${note("<b>Note:</b> newskit consumes appkit's tokens directly, so a retheme of appkit rethemes every article. Keep <code>kit/</code> on the appkit version newskit targets.")}`;
            sac.showcase.watchCode(page);
        });
    </script>
</body>
</html>
